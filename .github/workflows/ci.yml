name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Verify Next.js Build
        run: npm run build:vercel
        env:
          NEXT_PUBLIC_API_URL: https://api.clearlist.test
          NEXT_PUBLIC_SITE_URL: https://clearlist.test

  backend:
    name: Backend CI (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        env:
          PYTHONPATH: .
          ADMIN_SECRET_KEY: ci-test-admin-secret-key-123456789
          UPLOAD_TOKEN_SECRET: ci-test-upload-secret-123456789
          CORS_ORIGINS: http://localhost:3000
        run: python -m pytest -v -p no:cacheprovider

  build-backend-docker:
    name: Build & Push Backend Docker Image
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower-case repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-backend:latest
            ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend-vps:
    name: Deploy Backend to VPS
    needs: [build-backend-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower-case repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Check for VPS configuration
        id: check_vps
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USERNAME }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "VPS deployment skipped: Required secrets (VPS_HOST, VPS_USERNAME, VPS_SSH_KEY) are not set in GitHub repository settings."
          fi

      - name: Deploy to VPS via SSH
        if: steps.check_vps.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: REPO_LOWER,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e
            mkdir -p /opt/clearlist
            cd /opt/clearlist

            # Log into GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Set Backend image in environment
            export BACKEND_IMAGE="ghcr.io/${REPO_LOWER}-backend:latest"

            # Pull and restart containers
            docker compose pull api
            docker compose up -d --remove-orphans api caddy
            docker image prune -f
